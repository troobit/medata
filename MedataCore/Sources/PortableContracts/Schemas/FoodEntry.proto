syntax = "proto3";
package medata.research.v1;

import "BetaCorrectionTable.proto";

option swift_prefix = "Pb";

message FoodEntry {
    string class_id = 1;                        // matches segmenter palette
    string name = 2;
    float density_g_per_cm3 = 3;
    float energy_kj_per_100g = 4;
    float carbs_mono_g = 5;                     // monosaccharide-equivalent per 100 g
    float protein_g = 6;
    float fat_g = 7;
    float fibre_g = 8;
    float beta = 9;                             // β_c per Req 11.7
    BetaCalibrationStatus calibration_status = 10;
    string density_source = 11;
    string composition_source = 12;
}
