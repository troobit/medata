syntax = "proto3";
package medata.research.v1;

import "ClinicalMacros.proto";
import "PerClassMacros.proto";

option swift_prefix = "Pb";

message MacroResult {
    float total_carbs_g = 1;                    // displayed rounded to 1 g (Req 12.4) but persisted full precision (Req 12.5)
    map<string, PerClassMacros> per_class = 2;
    ClinicalMacros clinical_totals = 3;
}
