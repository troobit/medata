<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Medata — Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Caveat:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/wireframe.css" />
<style>
  body { margin: 0; background: #f0eee9; font-family: "Inter", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens/shell.jsx"></script>
<script type="text/babel" src="screens/capture.jsx"></script>
<script type="text/babel" src="screens/result.jsx"></script>
<script type="text/babel" src="screens/supporting.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showAnnotations": true,
  "captureFlow": "B",
  "resultLayout": "A"
}/*EDITMODE-END*/;

/* Annotation overlays for each screen */
const AnnotateCapture = ({ variant }) => {
  if (variant === "A") {
    return (
      <>
        <Annot style={{ top: 60, left: -150, width: 140 }}>
          Two-step rail<br/>shows progress.<br/>Single-view path<br/>auto-skips step 2
          <svg className="arrow" style={{ position: "absolute", right: -40, top: 14 }} width="40" height="20"><path d="M0 10 L36 10" stroke="currentColor" strokeWidth="1.2" fill="none"/><path d="M30 5 L36 10 L30 15" stroke="currentColor" strokeWidth="1.2" fill="none"/></svg>
        </Annot>
        <Annot style={{ top: 200, right: -160, width: 150 }} tone="ok">
          Bubble-level<br/>—familiar metaphor.<br/>Green when within ±5°
          <svg className="arrow" style={{ position: "absolute", left: -50, top: 18 }} width="50" height="20"><path d="M50 10 L8 10" stroke="currentColor" strokeWidth="1.2" fill="none"/><path d="M14 5 L8 10 L14 15" stroke="currentColor" strokeWidth="1.2" fill="none"/></svg>
        </Annot>
        <Annot style={{ bottom: 160, left: -160, width: 150 }}>
          Live telemetry<br/>tilt / dist / sensor<br/>so user sees<br/>what gates capture
        </Annot>
        <Annot style={{ bottom: 50, right: -150, width: 140 }}>
          Toggle to opt<br/>into two-view<br/>(reqs. §3.5)
          <svg className="arrow" style={{ position: "absolute", left: -40, top: 12 }} width="40" height="20"><path d="M40 10 L8 22" stroke="currentColor" strokeWidth="1.2" fill="none"/><path d="M14 18 L8 22 L14 28" stroke="currentColor" strokeWidth="1.2" fill="none"/></svg>
        </Annot>
      </>
    );
  }
  if (variant === "B") {
    return (
      <>
        <Annot style={{ top: 80, left: -160, width: 150 }}>
          Ghost outline<br/>tells user where<br/>to point. No numbers.
        </Annot>
        <Annot style={{ top: 200, right: -150, width: 140 }} tone="ok">
          Live "plate detected"<br/>chip — feedback<br/>that the system<br/>sees the meal
        </Annot>
        <Annot style={{ bottom: 90, left: -150, width: 140 }}>
          Single tap;<br/>app re-prompts<br/>for view 2 only<br/>if needed
        </Annot>
      </>
    );
  }
  // C
  return (
    <>
      <Annot style={{ top: 60, right: -160, width: 150 }}>
        Mostly chrome-free<br/>full-bleed dark UI.<br/>"NADIR" / "OBLIQUE"<br/>label = mode
      </Annot>
      <Annot style={{ top: 240, left: -170, width: 160 }} tone="ok">
        Auto-capture countdown<br/>once tilt + distance<br/>are within bounds
      </Annot>
      <Annot style={{ bottom: 110, right: -150, width: 140 }}>
        Status strip:<br/>tilt · dist · LiDAR · card<br/>—dense but glanceable
      </Annot>
      <Annot style={{ bottom: 30, left: -130, width: 120 }}>
        Override<br/>auto-capture<br/>any time
      </Annot>
    </>
  );
};

const AnnotateResult = ({ variant }) => {
  if (variant === "A") {
    return (
      <>
        <Annot style={{ top: 90, right: -160, width: 150 }}>
          Hero number first.<br/>1g rounding per req §12.4.<br/>Confidence chip below
          <svg className="arrow" style={{ position: "absolute", left: -50, top: 18 }} width="50" height="20"><path d="M50 10 L8 10" stroke="currentColor" strokeWidth="1.2" fill="none"/><path d="M14 5 L8 10 L14 15" stroke="currentColor" strokeWidth="1.2" fill="none"/></svg>
        </Annot>
        <Annot style={{ top: 280, left: -170, width: 160 }}>
          Per-class breakdown<br/>tucked below — visible<br/>without scroll, but<br/>hero is the answer
        </Annot>
        <Annot style={{ bottom: 60, right: -160, width: 150 }} tone="warn">
          Two CTAs:<br/>"adjust" before<br/>"save" — implies<br/>user agency
        </Annot>
      </>
    );
  }
  if (variant === "B") {
    return (
      <>
        <Annot style={{ top: 60, left: -160, width: 150 }}>
          Number + chip<br/>as a status row,<br/>not hero. Photo<br/>reasserts context.
        </Annot>
        <Annot style={{ top: 270, right: -160, width: 150 }}>
          Each class has its<br/>own confidence bar.<br/>Surfaces sub-σ.
        </Annot>
        <Annot style={{ bottom: 80, left: -150, width: 140 }}>
          Tap food row →<br/>direct edit (§14.1)
        </Annot>
      </>
    );
  }
  // C
  return (
    <>
      <Annot style={{ top: 70, right: -160, width: 150 }} tone="warn">
        When σ &lt; 0.6<br/>banner leads.<br/>Required by §13.5
      </Annot>
      <Annot style={{ top: 200, left: -180, width: 170 }}>
        Carb total + ±range<br/>+ sub-confidences spelled out:<br/>scale / seg / geom
      </Annot>
      <Annot style={{ bottom: 140, right: -150, width: 140 }}>
        Each row is tap-to-edit<br/>— low confidence assumes<br/>user will override
      </Annot>
    </>
  );
};

const Wrap = ({ children, anno }) => (
  <div className="artboard-wrap">
    {children}
    {anno}
  </div>
);

const captureMap = { A: CaptureA, B: CaptureB, C: CaptureC };
const resultMap = { A: ResultA, B: ResultB, C: ResultC };

const App = () => {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    if (t.showAnnotations) document.body.classList.remove("no-annot");
    else document.body.classList.add("no-annot");
  }, [t.showAnnotations]);

  const CapSel = captureMap[t.captureFlow] || CaptureA;
  const ResSel = resultMap[t.resultLayout] || ResultA;

  return (
    <>
      <DesignCanvas>
        <DCSection id="overview" title="Medata" subtitle="Mobile wireframes · low-fi · iPhone (LiDAR)">
          <DCArtboard id="hero" label="Selected capture flow" width={420} height={760}>
            <Wrap anno={<AnnotateCapture variant={t.captureFlow} />}>
              <CapSel />
            </Wrap>
          </DCArtboard>
          <DCArtboard id="hero-result" label="Selected result layout" width={420} height={760}>
            <Wrap anno={<AnnotateResult variant={t.resultLayout} />}>
              <ResSel />
            </Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="capture-variations" title="Capture flow — 3 directions" subtitle="Pick how the camera guides the user">
          <DCArtboard id="capA" label="A · Sequential + bubble level" width={380} height={720}>
            <Wrap anno={<AnnotateCapture variant="A" />}><CaptureA /></Wrap>
          </DCArtboard>
          <DCArtboard id="capB" label="B · Combined / progressive" width={380} height={720}>
            <Wrap anno={<AnnotateCapture variant="B" />}><CaptureB /></Wrap>
          </DCArtboard>
          <DCArtboard id="capC" label="C · Confidence-gated auto-capture" width={380} height={720}>
            <Wrap anno={<AnnotateCapture variant="C" />}><CaptureC /></Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="result-variations" title="Result screen — 3 directions" subtitle="How the carb total is presented">
          <DCArtboard id="resA" label="A · Single-number hero" width={380} height={720}>
            <Wrap anno={<AnnotateResult variant="A" />}><ResultA /></Wrap>
          </DCArtboard>
          <DCArtboard id="resB" label="B · Breakdown-first" width={380} height={720}>
            <Wrap anno={<AnnotateResult variant="B" />}><ResultB /></Wrap>
          </DCArtboard>
          <DCArtboard id="resC" label="C · Confidence-led" width={380} height={720}>
            <Wrap anno={<AnnotateResult variant="C" />}><ResultC /></Wrap>
          </DCArtboard>
        </DCSection>

        <DCSection id="flow" title="Supporting screens" subtitle="Segmentation review · correction · history · settings · about">
          <DCArtboard id="lidar-fork" label="LiDAR vs no-LiDAR fork" width={360} height={720}>
            <Wrap anno={
              <Annot style={{ top: 80, right: -150, width: 140 }} tone="ok">
                Quick path is the<br/>recommended one<br/>per req §3.5
              </Annot>
            }><LidarFork /></Wrap>
          </DCArtboard>
          <DCArtboard id="seg" label="Segmentation review" width={360} height={720}>
            <Wrap anno={
              <Annot style={{ bottom: 200, right: -160, width: 150 }} tone="warn">
                Unknown / liquid<br/>regions surfaced as<br/>banners — graceful<br/>per §8.6 / §8.7
              </Annot>
            }><Segmentation /></Wrap>
          </DCArtboard>
          <DCArtboard id="error" label="Capture error · tilt off" width={360} height={720}>
            <Wrap anno={
              <Annot style={{ top: 110, left: -160, width: 150 }} tone="warn">
                Soft failure: bubble<br/>turns amber, ghost<br/>copy says what's wrong,<br/>"skip to 2-view" escape hatch
              </Annot>
            }><Errors /></Wrap>
          </DCArtboard>
          <DCArtboard id="correction" label="Manual correction" width={360} height={720}>
            <Wrap anno={
              <Annot style={{ bottom: 120, left: -160, width: 150 }}>
                Original value<br/>preserved alongside<br/>correction (§14.2)
              </Annot>
            }><Correction /></Wrap>
          </DCArtboard>
          <DCArtboard id="history" label="History" width={360} height={720}>
            <Wrap anno={
              <Annot style={{ top: 100, right: -150, width: 140 }}>
                Confidence chip<br/>per meal — at-a-glance<br/>which need review
              </Annot>
            }><History /></Wrap>
          </DCArtboard>
          <DCArtboard id="settings" label="Settings" width={360} height={720}>
            <Wrap anno={
              <Annot style={{ top: 90, right: -150, width: 140 }}>
                "Account" greyed out<br/>= placeholder for<br/>future sign-in
              </Annot>
            }><Settings /></Wrap>
          </DCArtboard>
          <DCArtboard id="about" label="About / Legal" width={360} height={720}>
            <Wrap anno={
              <Annot style={{ top: 130, right: -160, width: 150 }}>
                CoFID OGL v3<br/>attribution required<br/>by §11.1
              </Annot>
            }><About /></Wrap>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Display" />
        <TweakToggle label="Designer annotations" value={t.showAnnotations}
          onChange={(v) => setTweak("showAnnotations", v)} />
        <TweakSection label="Featured at top" />
        <TweakRadio label="Capture flow" value={t.captureFlow}
          options={["A", "B", "C"]}
          onChange={(v) => setTweak("captureFlow", v)} />
        <TweakRadio label="Result layout" value={t.resultLayout}
          options={["A", "B", "C"]}
          onChange={(v) => setTweak("resultLayout", v)} />
      </TweaksPanel>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
